roles:
  admin:
    - url: "/**"
      actions: ["*"]

  vendedor:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/nextlink"
      actions: ["post"]
    - url: "/item/search"
      actions: ["post"]
    - url: "/business-partners/pedido-venda-parceiro/*"
      actions: ["get"]
    - url: "/contrato-venda-futura"
      actions: ["*"]
    - url: "/branch"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: ["*"]
    - url: "/sales-person/*"
      actions: ["get"]
    - url: "/item/search/branch/**"
      actions: ["*"]
    - url: "/prazo/tabela/**"
      actions: ["get"]
    - url: "/quotation/angular/**"
      actions: ["post"]
    - url: "/condicao/**"
      actions: ["get"]
    - url: "/forma-pagamento/filial/*/cardcode/*"
      actions: ["get"]
    - url: "/forma-pagamento/liberadas"
      actions: ["get"]
    - url: "/batch-stock/item-code/*/stock/*"
      actions: ["get"]
    - url: "/business-partners/novo"
      actions: ["post"]
    - url: "/quotation/**"
      actions: ["get"]
    - url: "/pedido-venda/listar"
      actions: ["get"]
    - url: "/pedido-venda/angular"
      actions: ["post"]
    - url: "/future-sales/pedidos/*"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*"
      actions: ["get"]
    - url: "/contrato-venda-futura/pedido-retirada"
      actions: ["*"]
    - url: "/contrato-venda-futura/**"
      actions: ["get"]
    - url: "/contrato-venda-futura/troca"
      actions: ["post"]
    # pre-requisito da troca: contrato antigo sem localidade e recusado no /troca e o erro manda
    # o usuario atribuir aqui. Sem esse put, quem pode trocar nao consegue destravar sozinho.
    - url: "/contrato-venda-futura/*/localidade"
      actions: ["put"]
    - url: "/contrato-venda-futura/emitir-boletos/*"
      actions: ["get"]
    - url: "/business-partners/cientes"
      actions: ["get"]
    - url: "/business-partners/*"
      actions: ["get"]
    - url: "/business-partners/contas-receber/**"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*/pix"
      actions: [ "post" ]
    - url: "/painel-vendas/**"
      actions: ["*"]
    - url: "/cobranca/titulos"
      actions: ["get"]
    - url: "/cobranca/titulos/*/*/*/historico"
      actions: ["get"]
    - url: "/invoice/**"
      actions: ["get"]

  vendedor_admin:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*/pix"
      actions: [ "post" ]
    - url: "/nextlink"
      actions: ["post"]
    - url: "/item/search"
      actions: ["post"]
    - url: "/item/search/branch/**"
      actions: ["*"]
    - url: "/painel/**"
      actions: ["*"]
    - url: "/painel-vendas/**"
      actions: ["*"]
    - url: "/branch"
      actions: ["get"]
    - url: "/sales-person/search"
      actions: ["*"]
    - url: "/sales-person/*"
      actions: ["get"]
    - url: "/sales-person/*/business-partners"
      actions: ["*"]
    - url: "/sales-person/replace/*/por/*"
      actions: ["*"]
    - url: "/forma-pagamento/filial/*/cardcode/*"
      actions: ["get"]
    - url: "/forma-pagamento/liberadas"
      actions: ["get"]
    - url: "/batch-stock/item-code/*/stock/*"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*"
      actions: ["get"]
    - url: "/contrato-venda-futura/pedido-retirada"
      actions: ["*"]
    - url: "/contrato-venda-futura/entregas/*"
      actions: ["get"]
    - url: "/contrato-venda-futura/**"
      actions: ["get"]
    - url: "/contrato-venda-futura/nextlink"
      actions: ["post"]
    - url: "/contrato-venda-futura/troca"
      actions: ["post"]
    # mesmo motivo do vendedor: sem esse put, quem pode trocar nao consegue atribuir a
    # localidade que a propria troca exige
    - url: "/contrato-venda-futura/*/localidade"
      actions: ["put"]
    - url: "/contrato-venda-futura/emitir-boletos/*"
      actions: ["get"]
    - url: "/future-sales/pedidos/*"
      actions: ["get"]
    - url: "/business-partners/**"
      actions: ["*"]
    - url: "/prazo/tabela/**"
      actions: ["get"]
    - url: "/pedido-venda/listar"
      actions: ["get"]
    - url: "/pedido-venda/angular"
      actions: ["*"]
    - url: "/quotation/**"
      actions: ["get"]
    - url: "/invoice/**"
      actions: ["get"]
  sysfeed:
    - url: "/sysfeed/fornecedores/pendentes"
      actions: ["get"]
    - url: "/sysfeed/fornecedores/*"
      actions: ["get"]
    - url: "/sysfeed/ordens-recebimento/pendentes"
      actions: ["get"]
    - url: "/sysfeed/ordens-producao/pendentes"
      actions: ["get"]
    - url: "/sysfeed/status"
      actions: ["post"]

  cobranca:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/cobranca/**"
      actions: ["get", "post"]
    # Remocao de linha do historico. Regra propria em vez de somar "delete" ao /cobranca/**:
    # o filtro e default-deny e assim DELETE novo em outro endpoint de cobranca nao entra de
    # carona. Quem pode remover de fato e so o autor da linha, conferido em CobrancaService.
    - url: "/cobranca/titulos/*/*/*/historico/*"
      actions: ["delete"]
    - url: "/business-partners/**"
      actions: ["get"]
    - url: "/contrato-venda-futura/**"
      actions: ["get"]
    - url: "/future-sales/pedidos/*"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*"
      actions: ["get"]
    - url: "/invoice/**"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: ["*"]
    - url: "/branch"
      actions: ["get"]
    - url: "/sales-person/search"
      actions: ["*"]
    # A lista de faturas resolve o nome do vendedor de cada linha com GET /sales-person/{id}.
    # Sem isso o cobrador tomava 403 por linha (a tela cai no codigo, mas suja o console).
    - url: "/sales-person/*"
      actions: ["get"]

  qualidade:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/batch-stock/item-code/**"
      actions: ["get"]
    - url: "/reprocessamento/**"
      actions: ["*"]
    # Menu Producao > Ordens de Producao (listagem e detalhe, somente leitura).
    - url: "/ordens-producao"
      actions: ["get"]
    - url: "/ordens-producao/*"
      actions: ["get"]
    - url: "/item/search"
      actions: ["post"]
    - url: "/painel/**"
      actions: ["*"]
    - url: "/branch"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: ["*"]
    - url: "/sales-person/search"
      actions: ["*"]
    - url: "/locais/search"
      actions: ["*"]

  logistica:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/carregamento"
      actions: ["get", "post"]
    - url: "/carregamento/search"
      actions: ["get"]
    - url: "/carregamento/estoque-em-carregamento"
      actions: ["get"]
    - url: "/carregamento/notas/*"
      actions: ["get"]
    - url: "/carregamento/*/logistica"
      actions: ["post"]
    - url: "/carregamento/*/cancel"
      actions: ["post"]
    - url: "/branch"
      actions: ["get"]
    - url: "/locais/search"
      actions: ["post"]
    - url: "/locais/*"
      actions: ["get"]
    - url: "/sales-person/search"
      actions: ["post"]
    - url: "/pedido-venda/findAllLoadOrders"
      actions: ["post"]
    - url: "/pedido-venda/findLoadOrders"
      actions: ["get"]
    - url: "/painel/pedidos"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: ["post"]
    - url: "/business-partners/*"
      actions: ["get"]
    - url: "/item/search"
      actions: ["post"]

  logistica_faturar:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/carregamento"
      actions: ["get", "post"]
    - url: "/carregamento/search"
      actions: ["get"]
    - url: "/carregamento/estoque-em-carregamento"
      actions: ["get"]
    - url: "/carregamento/notas/*"
      actions: ["get"]
    - url: "/carregamento/*/logistica"
      actions: ["post"]
    - url: "/carregamento/*/cancel"
      actions: ["post"]
    - url: "/carregamento/*/status"
      actions: ["post"]
    - url: "/carregamento/generate-from-loading-order/*"
      actions: ["post"]
    - url: "/batch-stock/item-code/**"
      actions: ["get"]
    - url: "/branch"
      actions: ["get"]
    - url: "/locais/search"
      actions: ["post"]
    - url: "/locais/*"
      actions: ["get"]
    - url: "/sales-person/search"
      actions: ["post"]
    - url: "/pedido-venda/findAllLoadOrders"
      actions: ["post"]
    - url: "/pedido-venda/findLoadOrders"
      actions: ["get"]
    - url: "/painel/pedidos"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: ["post"]
    - url: "/business-partners/*"
      actions: ["get"]
    - url: "/item/search"
      actions: ["post"]
  pix:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: [ "*" ]
    - url: "/branch"
      actions: [ "get" ]
    - url: "/pix"
      actions: ["get"]
    - url: "/pix/**"
      actions: ["get"]
    - url: "/pix/gerar-chave/**"
      actions: ["get","post"]
    - url: "/pix/transaction/**"
      actions: ["get"]
    - url: "/pix/checar-chave/**"
      actions: ["get"]
    - url: "/invoice/*/create-pix"
      actions: ["get"]
    - url: "/invoice/*/baixa-pix"
      actions: ["get"]
    - url: "/invoice/pix"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*/pix"
      actions: [ "post" ]

  pix_admin:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/business-partners/search"
      actions: [ "*" ]
    - url: "/branch"
      actions: [ "get" ]
    - url: "/pix"
      actions: ["get"]
    - url: "/pix/**"
      actions: ["get"]
    - url: "/pix/gerar-chave/**"
      actions: ["get"]
    - url: "/pix/transaction/**"
      actions: ["get"]
    - url: "/pix/checar-chave/**"
      actions: ["get"]
    - url: "/invoice/*/create-pix"
      actions: ["get"]
    - url: "/invoice/*/baixa-pix"
      actions: ["get"]
    - url: "/invoice/pix"
      actions: ["get"]
    - url: "/down-payment/contrato-venda-futura/*/pix"
      actions: [ "post" ]

  business_partner:
    - url: "/invoice/**/parcela/*"
      actions: ["get"]
    - url: "/invoice/cardcode/**/payment"
      actions: ["get"]
    - url: "/business-partners/cpf-cnpj/**"
      actions: ["get"]
    - url: "/tax/**/pdf"
      actions: ["get"]
    - url: "/installment/**/paid"
      actions: ["get"]

  # tela Relatorios > Calculadora: REST e o pedido de produtos pelo WebSocket
  # (SEND /calculadora-preco/get-async e checado como GET aqui)
  calculadora:
    - url: "/calculadora-preco"
      actions: ["*"]
    - url: "/calculadora-preco/**"
      actions: ["*"]

  liberacao_trava:
    # Menu Relatorios (sap-reports): o sap-service nao ve essas chamadas; a regra so decide se o item aparece no menu.
    # O que cada um ve DENTRO da tela continua sendo o campo papeis do YAML de cada relatorio no sap-reports.
    - url: "/reports/api/v1/relatorios"
      actions: ["get"]
    - url: "/trava/otp"
      actions: ["get"]
    - url: "/trava/regras"
      actions: ["get"]

  # Download em lote do DANFE e do XML das NF-e de saida (Financeiro > Notas e XML em lote).
  # Perfil proprio: quem baixa nota de todos os clientes nao precisa ser vendedor nem cobranca.
  nota_fiscal_lote:
    - url: "/nota-fiscal-lote"
      actions: ["get"]
    - url: "/nota-fiscal-lote/status-sefaz"
      actions: ["get"]
    - url: "/nota-fiscal-lote/status-boleto"
      actions: ["get"]
    - url: "/nota-fiscal-lote/formas-pagamento"
      actions: ["get"]
    # Monta o lote a partir da planilha de titulos do banco (so le).
    - url: "/nota-fiscal-lote/importar-planilha"
      actions: ["post"]
    # Troca a forma de pagamento dos documentos do lote (grava no SAP; vincula a forma ao parceiro
    # quando falta). Mesmo perfil do download, por decisao do usuario.
    - url: "/nota-fiscal-lote/forma-pagamento"
      actions: ["post"]
    - url: "/nota-fiscal-lote/download"
      actions: ["post"]
    # Busca de cliente da propria tela, sem o recorte de carteira do /business-partners/search.
    - url: "/nota-fiscal-lote/clientes/search"
      actions: ["post"]
    - url: "/branch"
      actions: ["get"]
    - url: "/sales-person/search"
      actions: ["*"]

  # Tela de importacao de lancamentos contabeis (CSV). Nao liberar /journal/** para este perfil:
  # POST /journal/save grava sem validar e GET /journal/default-memo/* reescreve o historico.
  contabil_importacao:
    - url: "/journal/importacao/validar"
      actions: ["post"]
    - url: "/journal/importacao"
      actions: ["post"]
    - url: "/journal/importacao/historico"
      actions: ["get"]
